<!doctype html>
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sem conexão - Clínica Espaço Saúde</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; background: #f8fafc; color: #1e293b; text-align: center; }
      main { padding: 24px; max-width: 320px; }
      img { width: 96px; height: 96px; border-radius: 24px; }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { color: #64748b; margin: 0 0 24px; }
      button { background: #2563eb; color: #fff; border: 0; border-radius: 10px; padding: 12px 24px; font-size: 16px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Sem conexão com a internet</h1>
      <p>Verifique o Wi-Fi ou os dados móveis e tente de novo.</p>
      <button onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
